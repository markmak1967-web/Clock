<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>My MGF - The Clock</title>
<style>
:root{--bg:#0b0d10;--card:#161a20;--line:#262c35;--txt:#eef2f6;--dim:#8b95a3;--acc:#f2a33a;--ok:#3ccf7e;--amb:#f2c53a;--red:#ff4d4d;--seg:#20252d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
main{max-width:620px;margin:0 auto;padding:16px 16px 60px}
h1{font-size:24px;margin:4px 0 2px}.sub{color:var(--dim);font-size:14px;margin-bottom:14px}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:14px}.card h2{font-size:18px;margin:0 0 10px}
.row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid var(--line)}.row:first-of-type{border-top:0}
.dot{display:inline-block;width:12px;height:12px;border-radius:6px;margin-right:8px;vertical-align:-1px}
.g{background:var(--ok)}.a{background:var(--amb)}.r{background:var(--red)}
.adv{border-left:5px solid var(--amb);padding:4px 0 4px 12px;margin:12px 0}.adv.ai{border-color:#5b7cfa}.adv.done{opacity:.55;border-color:#39414d}
.adv b{display:block;font-size:17px}.adv p{margin:4px 0 8px;color:#c9d2dc;font-size:15px}.tag{font-size:12px;color:var(--dim);letter-spacing:.4px;text-transform:uppercase}
select,button{font:600 15px inherit;font-family:inherit;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--seg);color:var(--txt);padding:0 12px}
button.acc{background:var(--acc);color:#1a1205;border:0}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px}.kv div{background:var(--seg);border-radius:12px;padding:10px}.kv small{display:block;color:var(--dim);font-size:12px}.kv b{font-size:19px}
.band{margin:12px 0}.band .l{display:flex;justify-content:space-between;font-size:15px}.band .l span{color:var(--dim);font-size:13px}
.strip{position:relative;height:14px;background:#2a313b;border-radius:7px;margin-top:6px}.strip i{position:absolute;top:0;height:14px;background:#2f6d4c;border-radius:7px}
.strip em{position:absolute;top:-3px;width:20px;height:20px;border-radius:10px;background:var(--acc);border:2px solid var(--bg);margin-left:-10px}
.msg{padding:30px 6px;color:var(--dim)}
.note{color:var(--dim);font-size:13px}svg{display:block;width:100%;height:56px}
a{color:#58a6ff}
</style></head><body><main id="m"></main>
<script src="config.js"></script>
<script>
addEventListener('hashchange', () => location.reload());
let D = null; const TOKEN = decodeURIComponent(location.hash.slice(1)), API = window.CLOCK.sheet;
const call = q => fetch(API + '?' + new URLSearchParams(q), {cache: 'no-store'}).then(r => r.json());
const $ = s => document.querySelector(s), esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
function fmt(v, u) { if (v == null || v === '') return '–'; const n = Number(v); if (isNaN(n)) return esc(v); return (u === 'share' ? Math.round(n * 100) + ' %' : (Math.abs(n) >= 100 ? n.toFixed(0) : n.toFixed(1)) + (u && u !== 'share' ? ' ' + u : '')); }
function spark(v) {
  const p = v.map((x, i) => [i, x]).filter(q => q[1] != null); if (p.length < 2) return '<p class="note">Not enough runs yet.</p>';
  const ys = p.map(q => q[1]), lo = Math.min(...ys), hi = Math.max(...ys), sp = hi - lo || 1, w = 300, n = v.length - 1 || 1;
  const pts = p.map(q => (q[0] / n * w).toFixed(1) + ',' + (50 - (q[1] - lo) / sp * 44).toFixed(1)).join(' ');
  return `<svg viewBox="0 0 300 56" preserveAspectRatio="none"><polyline fill="none" stroke="#f2a33a" stroke-width="2.5" points="${pts}"/></svg><div class="note">${fmt(ys[0])} → ${fmt(ys[ys.length - 1])} over ${p.length} runs</div>`;
}
function band(b) {
  if (b.mine == null) return '';
  if (b.p10 == null) return `<div class="band"><div class="l">${esc(b.label)} <b>${fmt(b.mine, b.unit)}</b></div><div class="note">Not enough similar cars to compare yet (${b.cars}).</div></div>`;
  const lo = Math.min(b.p10, b.mine) , hi = Math.max(b.p90, b.mine), sp = (hi - lo) || 1, pad = sp * 0.15, L = lo - pad, S = sp + pad * 2;
  const x = v => ((v - L) / S * 100).toFixed(1);
  const pct = b.pct != null ? ` · ${b.kind === 'usage' ? 'more than' : 'higher than'} ${b.pct} % of similar MGFs` : '';
  return `<div class="band"><div class="l">${esc(b.label)} <span>${fmt(b.mine, b.unit)}${pct}</span></div>
    <div class="strip"><i style="left:${x(b.p10)}%;width:${(x(b.p90) - x(b.p10)).toFixed(1)}%"></i><em style="left:${x(b.mine)}%"></em></div>
    <div class="note">Similar MGFs ${fmt(b.p10, b.unit)} to ${fmt(b.p90, b.unit)}</div></div>`;
}
// one line on the AI suggestions: off, waiting, or what the last review found
function aiNote() {
  if (!D.ai) return '<p class="note">AI suggestions are off. Turn on "Ask for more" on the gauge page to add them to the fixed checks.</p>';
  if (D.ai_key === false) return '<p class="note">AI suggestions are on for this car, but the AI service is not set up yet.</p>';
  const L = D.ai_last, has = D.advice.some(a => a.source === 'ai');
  if (!L) return '<p class="note">AI suggestions are on. The first AI review runs overnight, once there are 3 runs.</p>';
  const when = new Date(L.when).toLocaleDateString();
  if (/failed/.test(L.kind)) return `<p class="note">AI suggestions are on. The last AI review (${when}) did not complete; it tries again overnight.</p>`;
  if (/skipped/.test(L.kind)) return `<p class="note">AI suggestions are on. The AI review is waiting: ${esc(L.detail)}.</p>`;
  return `<p class="note">AI review ${when}: ${has ? 'its suggestions are marked AI above' : 'nothing stood out'}. One review a week.</p>`;
}
function render() {
  const c = D.car, h = D.health;
  let html = `<h1>${esc(c.name || 'My MGF')}</h1><div class="sub">${esc([c.year, c.model, c.engine].filter(Boolean).join(' '))} · last data ${D.last_seen ? new Date(D.last_seen).toLocaleString() : 'not yet'}</div>`;
  html += `<div class="card"><h2>How the car is</h2>${h.map(x => `<div class="row"><span><span class="dot ${x.level >= 2 ? 'a' : x.level ? 'a' : 'g'}"></span>${esc(x.system)}</span><b style="color:${x.level ? 'var(--amb)' : 'var(--ok)'}">${x.word}</b></div>`).join('')}</div>`;
  const adv = D.advice;
  html += `<div class="card"><h2>Advice</h2>${adv.length ? '' : '<p class="note">Nothing to look at. Advice appears here when the readings show something worth asking your mechanic about.</p>'}${adv.map(a => `
    <div class="adv ${a.source === 'ai' ? 'ai' : ''} ${a.status === 'Fixed' || a.status === 'Not a problem' ? 'done' : ''}"><span class="tag">${a.source === 'ai' ? 'AI suggestion · an idea to discuss, not a diagnosis' : esc(a.system)} · ${new Date(a.created).toLocaleDateString()}</span>
    <b>${esc(a.title)}</b><p>${esc(a.text)}</p>
    <select data-id="${esc(a.id)}">${['Open', 'Asked my mechanic', 'Fixed', 'Not a problem'].map(s => `<option${s === a.status ? ' selected' : ''}>${s}</option>`).join('')}</select></div>`).join('')}
    ${aiNote()}<p class="note">Setting the status helps: it tells us which suggestions turned out to be right.</p></div>`;
  html += `<div class="card"><h2>Trends</h2>${D.trends.map(t => `<div style="margin:10px 0 14px"><div>${esc(t.label)}</div>${spark(t.v)}</div>`).join('')}</div>`;
  html += `<div class="card"><h2>Compared with similar MGFs</h2><p class="note">Your car's latest 1,000 km against other ${esc(D.group)} cars. A position, not a score.${D.in_progress_km ? ' Current block: ' + D.in_progress_km + ' of 1,000 km.' : ''}</p>${D.bands.map(band).join('') || '<p class="note">After the first 1,000 km.</p>'}</div>`;
  if (D.usage) html += `<div class="card"><h2>How the car is used (last 1,000 km)</h2><div class="kv">
    <div><small>Runs that never warmed up</small><b>${fmt(D.usage.short)}</b><small>per 1,000 km</small></div><div><small>Engine time idling</small><b>${fmt(D.usage.idle, 'share')}</b></div>
    <div><small>Firm stops</small><b>${fmt(D.usage.firm)}</b><small>per 1,000 km</small></div><div><small>Road impacts</small><b>${fmt(D.usage.impacts)}</b><small>per 1,000 km</small></div></div>
    <p class="note">This describes wear on the car (it helps choose service intervals), not how well anyone drives.</p></div>`;
  const L = D.life;
  html += `<div class="card"><h2>Engine life since the gauge was fitted</h2><div class="kv"><div><small>Engine hours</small><b>${fmt(L.eng_h)}</b></div><div><small>Revolutions</small><b>${fmt(L.revs_m)} million</b></div>
    <div><small>Starts</small><b>${esc(L.starts || '–')}</b></div><div><small>Runs</small><b>${esc(L.runs || '–')}</b></div></div></div>`;
  html += `<div class="card"><h2>Your data</h2><p class="note">Your gauge sends run summaries, alerts and baseline checks. It never sends where the car is.</p>
    <p><a href="${esc(D.csv)}">Download all my run summaries</a></p>
    <p><button id="pause">${D.paused ? 'Start the advice emails again' : 'Pause the advice emails'}</button></p>
    <p><button id="del">Delete my data</button></p>
    <p class="note">To stop sending altogether, untick "Send my data" on the gauge page.</p></div>`;
  $('#m').innerHTML = html;
  document.querySelectorAll('select[data-id]').forEach(s => s.onchange = () => call({api: 'status', t: TOKEN, id: s.dataset.id, s: s.value}).then(r => { if (!r.ok) alert('Not saved'); }).catch(() => alert('Not saved: no connection')));
  $('#pause').onclick = () => call({api: 'req', t: TOKEN, k: D.paused ? 'resume' : 'pause'}).then(r => { if (r.ok) { D.paused = !D.paused; render(); } });
  $('#del').onclick = () => { if (confirm('Delete all of this car\'s data from the sheet? This cannot be undone. Your page link will stop working.')) call({api: 'req', t: TOKEN, k: 'delete'}).then(r => { if (r.ok) $('#m').innerHTML = '<h1>Deleted</h1><p>Your data has been removed. Untick "Send my data" on the gauge page so nothing more is sent.</p>'; }); };
}
$('#m').innerHTML = '<div class="msg">Loading your car...</div>';
if (!TOKEN) $('#m').innerHTML = '<div class="msg">Open this page from the link in your email.</div>';
else call({api: 'car', t: TOKEN}).then(d => { if (!d.ok) { $('#m').innerHTML = '<div class="msg">' + esc(d.error) + '</div>'; return; } D = d; document.title = (d.car.name || 'My MGF') + ' - The Clock'; render(); })
  .catch(() => { $('#m').innerHTML = '<div class="msg">Could not reach the data. Check your connection and reload.</div>'; });
</script></body></html>
